name: JabraButtonProbe
options:
  bundleIdPrefix: local.jabrateamsremap
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
targets:
  JabraButtonProbe:
    type: application
    platform: iOS
    sources: [JabraButtonProbe]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Jabra Probe
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: Discover your headset and inspect exposed Bluetooth button notifications for this diagnostic test.
        UIBackgroundModes: [audio, bluetooth-central]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.jabrateamsremap.iosprobe
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: [JabraButtonProbeTests, JabraButtonProbeUITests]
  JabraButtonProbeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: JabraButtonProbe
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  JabraButtonProbeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: JabraButtonProbe
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: JabraButtonProbe
